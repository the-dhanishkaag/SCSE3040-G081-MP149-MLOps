
name: CI Pipeline - Model, API, Docker and Kubernetes Validation

on:
  push:
    branches:
      - main
      - stage2-dhanishka-training
      - stage3-dhanishka-fastapi-logging
      - stage3-daksh-docker
      - stage3-agam-kubernetes
      - stage3-rudraksh-github-actions

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automated tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t mp149-fishing-api:v1 .

  kubernetes-validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform

      - name: Validate Kubernetes YAML files
        run: |
          kubeconform -strict -summary k8s/deployment.yaml k8s/service.yaml
