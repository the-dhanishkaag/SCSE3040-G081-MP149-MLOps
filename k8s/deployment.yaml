apiVersion: apps/v1
kind: Deployment
metadata:
  name: fishing-catch-api-deployment
  labels:
    app: fishing-catch-api
    project: g081-mp149
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fishing-catch-api
  template:
    metadata:
      labels:
        app: fishing-catch-api
    spec:
      containers:
        - name: fishing-catch-api
          image: mp149-fishing-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
